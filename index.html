<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="theme-color" content="#041b11" />
    <script>
      (function () {
        // Prevent third-party browser extensions (e.g. request interceptors) from crashing
        // when attempting to overwrite a getter-only window.fetch property
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                currentFetch = fn;
              }
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (e) {
            var filename = (e && e.filename) || '';
            var message = (e && e.message) || '';
            if (
              filename.indexOf('chrome-extension://') === 0 ||
              message.indexOf('Cannot set property fetch') !== -1
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
